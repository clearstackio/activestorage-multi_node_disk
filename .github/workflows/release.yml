# Publishes to rubygems.org with trusted publishing (OIDC, no API key) and a
# Sigstore attestation, when a `v*` tag matching version.rb is pushed. The
# rubygems.org trusted publisher names this workflow and the `rubygems`
# environment.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems
    # The tag already exists, so `rake release` pushes nothing to git: no write
    # access, and no token left in .git/config.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Check the tag matches the version
        run: |
          version="$(ruby -Ilib -e 'require "active_storage/multi_node_disk/version"; print ActiveStorage::MultiNodeDisk::VERSION')"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: bundle exec rake
      - uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2
